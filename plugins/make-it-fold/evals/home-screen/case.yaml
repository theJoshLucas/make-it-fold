schema_version: '1.1'
name: home-screen-practice-timer
description: 'Practice home-screen web app (Practice Timer, standalone manifest) with 5 planted iPhone Duo bugs
  (see answer-key.md, which the agent never sees). A fresh session is told only to optimize it for the Duo.

  '
tags:
- home-screen
- fully-tested
plugins:
- ../..
runs: 1
context:
  scaffold_script: copy-app.sh
execution:
  prompt: 'This folder is a small web app that people add to their Home Screen (open index.html; there is

    no build step). Optimize it for the iPhone Duo. When you are done, write your final report to

    duo-report.md in this folder.

    '
  max_turns: 150
  timeout_seconds: 3000
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Edit
  - Write
graders:
- name: H1-safe-area-bottom
  type: regex
  target:
    source: file
    path: style.css
  pattern: safe-area-inset-bottom
- name: H1-safe-area-sides
  type: regex
  target:
    source: file
    path: style.css
  pattern: safe-area-inset-(left|right)
- name: H2-no-900px-landscape-minimum
  type: regex
  target:
    source: file
    path: style.css
  pattern: \.main\s*\{[^}]*min-width:\s*900px
  match: not_contains
- name: H2-still-standalone
  type: regex
  target:
    source: file
    path: manifest.webmanifest
  pattern: '"display"\s*:\s*"standalone"'
- name: H3-no-bare-100vh-shell
  type: regex
  target:
    source: file
    path: style.css
  pattern: 100(d|s)vh|min-height:\s*100%|height:\s*auto
- name: H4-timer-size-capped
  type: regex
  target:
    source: file
    path: style.css
  pattern: \.timer\s*\{[^}]*font-size:\s*(min|clamp)\(|\.timer\s*\{[^}]*font-size:\s*[\d.]+(px|rem|cqi|cqw|cqmin)\s*;
  match: contains
- name: H5-log-height-not-read-once
  type: regex
  target:
    source: file
    path: app.js
  pattern: (?<![\s\S])(?![\s\S]*innerHeight)|addEventListener\(\s*['"]resize['"]|visualViewport
- name: no-redesign-sections-kept
  type: regex
  target:
    source: file
    path: index.html
  pattern: (?=[\s\S]*Practice Timer)(?=[\s\S]*id="toggle")(?=[\s\S]*>Start<)(?=[\s\S]*>Today<)(?=[\s\S]*class="tabbar")(?=[\s\S]*>Goals<)
- name: no-redesign-colors-kept
  type: regex
  target:
    source: file
    path: style.css
  pattern: (?=[\s\S]*#101418)(?=[\s\S]*#1a2027)(?=[\s\S]*#4cc38a)(?=[\s\S]*#ff6b5e)
- name: landscape-and-timer-judge
  type: llm
  focus:
    source: file
    path: style.css
  weight: 2
  criteria: 'Look at style.css. PASS only if BOTH hold: (1) the wide side-by-side layout no longer forces a minimum
    width that cannot fit a 594 px wide landscape window (the 900 px minimum is gone, or the side-by-side rule only
    applies at 900 px wide or more), so the page cannot scroll sideways at 594 px; and (2) on wide screens (about
    950 px) the timer digits can no longer grow past their 480 px card: any cap works (min()/clamp(), a px/rem size
    inside a wide-screen rule, container units such as cqi, or a height limit). A plain `vw` size that only applies
    below 900 px is fine (it measured fine on the Duo simulator). FAIL if either is missing.'
- name: honest-report
  type: llm
  focus:
    source: file
    path: duo-report.md
  criteria: 'PASS if duo-report.md (1) lists what changed in plain words, (2) says which checks were actually run
    and on what

    (Duo simulator, desktop browser, or code reading only) without claiming checks that were not run, and

    (3) says that the installed Home Screen app itself (added from Safari) was not tested unless it really was,
    and

    lists what still needs a real phone or could not be checked. FAIL if it claims simulator or device proof that

    the run could not have produced, claims the installed Home Screen app was verified without evidence, or if the

    file is missing.

    Also required: about any orientation lock (manifest or app.json), the run either removed it, or kept it and
    said in the report that the Duo''s inner screen ignores it and that removing it is the person''s decision. Either
    is a PASS for that point; silently keeping it with a layout that breaks sideways is a FAIL.'
