schema_version: '1.1'
name: web-setlist-no-changes
description: 'The Setlist practice app with every planted Duo bug already fixed. The right answer is "passes, no
  changes": a correct run checks it and leaves the app code alone.

  '
tags:
- web
- fully-tested
- no-busywork
plugins:
- ../..
runs: 1
context:
  scaffold_script: copy-app.sh
execution:
  prompt: 'This folder is a small web app (open index.html; there is no build step). Optimize it for the

    iPhone Duo. When you are done, write your final report to duo-report.md in this folder.

    '
  max_turns: 120
  timeout_seconds: 2400
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Edit
  - Write
graders:
- name: app-code-not-edited
  type: tool_used
  tool: Edit
  input_match: (index\.html|style\.css|app\.js)
  max: 0
  min: 0
- name: still-fixed-css
  type: regex
  target:
    source: file
    path: style.css
  pattern: '\.table-scroll \{ overflow-x: auto;'
- name: still-fixed-js
  type: regex
  target:
    source: file
    path: app.js
  pattern: 'querySelector\("\.content"\)\.clientWidth < 500'
- name: says-no-changes-needed
  type: llm
  focus:
    source: file
    path: duo-report.md
  weight: 2
  criteria: 'PASS if duo-report.md says the app''s code (index.html, style.css, app.js) was not changed because
    nothing needed fixing, and is honest about which checks were actually run. Saying the simulator or a browser
    was unavailable, and that on-screen proof is still pending, is fine and expected. Adding a test scenario or
    notes file is fine.

    FAIL if it reports edits to index.html, style.css or app.js, invents problems, or claims checks that were not
    run.'
