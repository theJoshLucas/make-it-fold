schema_version: '1.1'
name: expo-pocket-chores
description: 'Practice Expo app (Pocket Chores, Expo SDK 58 with Expo Router) with 5 planted iPhone Duo bugs (see
  answer-key.md, which the agent never sees). A fresh session is told only to optimize it for the Duo. Source tree
  only: no install, no native build.

  '
tags:
- expo
- code-only
plugins:
- ../..
runs: 1
context:
  scaffold_script: copy-app.sh
execution:
  prompt: 'This folder is a small Expo (React Native) app using Expo Router. Optimize it for the iPhone

    Duo. When you are done, write your final report to duo-report.md in this folder.

    '
  max_turns: 150
  timeout_seconds: 3000
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Edit
  - Write
graders:
- name: X1-tabs-native-or-padded-on-all-sides
  type: regex
  target:
    source: file
    path: app/_layout.tsx
  pattern: NativeTabs|insets\.(left|right)|paddingLeft:\s*insets|edges=\{\[[^\]]*"left"
  match: contains
- name: X2-no-screen-dimensions
  type: regex
  target:
    source: file
    path: app/index.tsx
  pattern: =\s*Dimensions\.get\(\s*["']screen["']\s*\)
  match: not_contains
- name: X2-no-startup-width-on-rows
  type: regex
  target:
    source: file
    path: app/index.tsx
  pattern: width:\s*SCREEN_WIDTH
  match: not_contains
- name: X3-not-top-bottom-only
  type: regex
  target:
    source: file
    path: app/_layout.tsx
  pattern: edges=\{\[\s*"top",\s*"bottom"\s*\]\}
  match: not_contains
- name: X4-forms-do-not-own-state
  type: regex
  target:
    source: file
    path: app/new.tsx
  pattern: function (CompactForm|WideForm)\([^)]*\)\s*\{\s*const \[\w+, set\w+\] = useState
  match: not_contains
- name: no-redesign-layout-kept
  type: regex
  target:
    source: file
    path: app/_layout.tsx
  pattern: (?=[\s\S]*Today)(?=[\s\S]*New)(?=[\s\S]*Settings)(?=[\s\S]*#f6f4ef)
- name: no-redesign-today-kept
  type: regex
  target:
    source: file
    path: app/index.tsx
  pattern: (?=[\s\S]*Water the plants)(?=[\s\S]*Wipe the counters)(?=[\s\S]*Sweep the porch)(?=[\s\S]*#fff)
- name: no-redesign-new-kept
  type: regex
  target:
    source: file
    path: app/new.tsx
  pattern: (?=[\s\S]*New chore)(?=[\s\S]*Add chore)(?=[\s\S]*CompactForm)(?=[\s\S]*WideForm)(?=[\s\S]*#1f6f4a)
- name: no-redesign-versions-kept
  type: regex
  target:
    source: file
    path: package.json
  pattern: (?=[\s\S]*"expo"\s*:\s*"~58\.0\.0")(?=[\s\S]*"react-native"\s*:\s*"0\.88\.1")(?=[\s\S]*"expo-router"\s*:\s*"~58\.0\.30")
- name: navigation-and-insets-judge
  type: llm
  focus:
    source: file
    path: app/_layout.tsx
  weight: 2
  criteria: 'Look at app/_layout.tsx. PASS if the bottom navigation is drawn by the system through Expo Router NativeTabs

    (not a row of Pressable views), OR the custom JavaScript tab bar was kept AND is padded with the safe area on
    all

    four sides (the report then has to list it as still open). Left and right safe-area insets must be handled

    (in SafeAreaView edges, useSafeAreaInsets padding, or by the native navigation). FAIL otherwise.

    '
- name: honest-report
  type: llm
  focus:
    source: file
    path: duo-report.md
  criteria: 'PASS if duo-report.md (1) lists what changed in plain words, (2) says which checks were actually run
    and on what

    (code reading, a type check, or a native build on the Duo simulator) without claiming checks that were not run;

    in particular it must not claim Duo simulator or device proof if no native build was run, and (3) lists what
    still

    needs a native build on the Duo simulator or a real phone, and anything left open (such as a custom tab bar
    that

    was kept). FAIL if it claims proof the run could not have produced, or if the file is missing.

    Also required: about any orientation lock (manifest or app.json), the run either removed it, or kept it and
    said in the report that the Duo''s inner screen ignores it and that removing it is the person''s decision. Either
    is a PASS for that point; silently keeping it with a layout that breaks sideways is a FAIL.'
